<div class="auth-page">
  <app-panel-acceso titulo="Creá tu cuenta" texto="Con tu registro ya podés pedir tu primer turno." />
  <mat-card class="auth-card">
    <mat-card-header>
      <mat-card-title>Registro de paciente</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <app-paciente-form textoBoton="Registrarme" [enviando]="enviando()" (guardar)="registrar($event)" />
    </mat-card-content>

    <mat-card-footer class="auth-footer">
      <span>¿Ya tenés cuenta?</span>
      <a routerLink="/login">Iniciar sesión</a>
    </mat-card-footer>
  </mat-card>
</div>
