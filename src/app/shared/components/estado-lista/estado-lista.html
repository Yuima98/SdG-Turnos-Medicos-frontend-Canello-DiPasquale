@if (cargando()) {
  <div class="estado" role="status" aria-label="Cargando">
    <mat-spinner diameter="36" />
  </div>
} @else if (error()) {
  <div class="estado" role="alert">
    <span class="estado-icono error"><mat-icon aria-hidden="true">error_outline</mat-icon></span>
    <strong>No pudimos mostrar la información</strong>
    <p>{{ error() }}</p>
    <button mat-stroked-button type="button" (click)="reintentar.emit()">
      <mat-icon>refresh</mat-icon>
      Reintentar
    </button>
  </div>
} @else if (vacio()) {
  <div class="estado">
    <span class="estado-icono"><mat-icon aria-hidden="true">{{ iconoVacio() }}</mat-icon></span>
    <p>{{ mensajeVacio() }}</p>
  </div>
} @else {
  <ng-content />
}
