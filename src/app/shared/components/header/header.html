<mat-toolbar class="header">
  @if (auth.estaLogueado()) {
    <button mat-icon-button [matMenuTriggerFor]="menuNav" aria-label="Abrir menú de navegación">
      <mat-icon>menu</mat-icon>
    </button>
    <a routerLink="/" class="header-title">
      <app-logo />
      Clínica Virtual
    </a>
  } @else {
    <a routerLink="/" class="header-title">
      <app-logo />
      Clínica Virtual
    </a>
  }

  <span class="header-spacer"></span>

  @if (auth.estaLogueado()) {
    <app-notificaciones />
    <span class="header-usuario">{{ auth.usuario()?.nombre }} {{ auth.usuario()?.apellido }}</span>
    <span class="header-rol">{{ etiquetaRol() }}</span>
    <button mat-button (click)="cerrarSesion()">Cerrar sesión</button>
  } @else {
    <button mat-button routerLink="/login">Iniciar sesión</button>
    <button mat-raised-button routerLink="/registro">Registrarse</button>
  }
</mat-toolbar>

<mat-menu #menuNav="matMenu">
  @for (opcion of opcionesMenu(); track opcion.ruta) {
    <a mat-menu-item [routerLink]="opcion.ruta" [class]="'tono-' + opcion.tono">
      <mat-icon class="icono-tono">{{ opcion.icono }}</mat-icon>
      <span>{{ opcion.etiqueta }}</span>
    </a>
  }
</mat-menu>
